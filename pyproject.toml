[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prefect_pipeline"
version = "0.1.0.dev0"
description = "A domain-agnostic, Prefect v3 based orchestration framework for LLM-driven data pipelines."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hartefisher" }]
keywords = ["prefect", "pipeline", "llm", "orchestration", "etl"]
dependencies = [
    "prefect>=3.6,<4",
    "litellm>=1.81,<2",
    "motor>=3.7",
    "qdrant-client>=1.16",
    "fastembed>=0.8",
    "pydantic>=2.12",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    "httpx>=0.28",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
# 可选依赖：浏览器爬虫（CDPSpider 实现）
cdp = ["playwright>=1.61"]

[project.urls]
Homepage = "https://github.com/hartefisher/prefect-pipeline"
Repository = "https://github.com/hartefisher/prefect-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["src/prefect_pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.11",
]

# ----------------------------------------------------------------------------
# Lint & type check（M1 工程化基线，功能点 #7）
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# 文档（.md）内含示例代码块，不由 ruff 格式化；README 等亦排除
extend-exclude = ["docs", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "B008", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["prefect_pipeline"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["src/generated", ".venv"]

[[tool.mypy.overrides]]
module = "prefect_pipeline.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need external services (mongo/qdrant via docker-compose)",
]
